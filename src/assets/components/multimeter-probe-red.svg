<svg xmlns="http://www.w3.org/2000/svg" width="28" height="86" viewBox="0 0 28 86" fill="none">
  <defs>
    <linearGradient id="probeRedBody" x1="6" y1="0" x2="22" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d111c"/>
      <stop offset="0.22" stop-color="#c33546"/>
      <stop offset="0.46" stop-color="#f0808f"/>
      <stop offset="0.68" stop-color="#d9485b"/>
      <stop offset="1" stop-color="#5f0e18"/>
    </linearGradient>
    <linearGradient id="probeRedBoot" x1="9" y1="0" x2="19" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#210c11"/>
      <stop offset="0.42" stop-color="#5a2530"/>
      <stop offset="1" stop-color="#1b090d"/>
    </linearGradient>
    <linearGradient id="probeRedSteel" x1="11" y1="0" x2="17" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4c555f"/>
      <stop offset="0.3" stop-color="#e6ecf3"/>
      <stop offset="0.6" stop-color="#a8b3bf"/>
      <stop offset="1" stop-color="#414a54"/>
    </linearGradient>
  </defs>

  <!-- Rubber boot where the lead enters, ribbed so the cable can flex. -->
  <path d="M10.9 0h6.2l1.1 7.2c.25 1.7-.7 2.9-2.3 2.9h-4c-1.6 0-2.55-1.2-2.3-2.9L10.9 0Z" fill="url(#probeRedBoot)"/>
  <rect x="9.7" y="3.1" width="8.6" height="1.1" rx="0.55" fill="#000" opacity="0.38"/>
  <rect x="9.5" y="5.7" width="9" height="1.1" rx="0.55" fill="#000" opacity="0.38"/>
  <rect x="9.4" y="8.3" width="9.2" height="1.1" rx="0.55" fill="#000" opacity="0.38"/>

  <!-- Moulded handle: narrow at the cable, swelling towards the finger guard. -->
  <path d="M9.2 12C9.2 10.4 11.2 9.4 14 9.4C16.8 9.4 18.8 10.4 18.8 12L20.6 46C20.9 50.2 18.2 52.4 14 52.4C9.8 52.4 7.1 50.2 7.4 46Z"
        fill="url(#probeRedBody)" stroke="#460c14" stroke-width="0.9"/>

  <!-- Grip ribs. -->
  <rect x="9.2" y="19" width="9.6" height="1.5" rx="0.75" fill="#3d0a11" opacity="0.42"/>
  <rect x="9.1" y="24" width="9.8" height="1.5" rx="0.75" fill="#3d0a11" opacity="0.42"/>
  <rect x="9" y="29" width="10" height="1.5" rx="0.75" fill="#3d0a11" opacity="0.42"/>
  <rect x="8.9" y="34" width="10.2" height="1.5" rx="0.75" fill="#3d0a11" opacity="0.42"/>

  <!-- The light running down one side is what reads as "round". -->
  <rect x="10.2" y="13" width="1.9" height="34" rx="0.95" fill="#fff" opacity="0.32"/>

  <!-- Finger guard: the flange that stops a hand sliding onto the tip. -->
  <path d="M14 49.4C18.9 49.4 22.2 51.2 22.2 53.7C22.2 56.2 18.9 58 14 58C9.1 58 5.8 56.2 5.8 53.7C5.8 51.2 9.1 49.4 14 49.4Z"
        fill="url(#probeRedBody)" stroke="#460c14" stroke-width="0.9"/>
  <path d="M8.4 52.2C9.9 51.1 11.8 50.6 14 50.6" stroke="#fff" stroke-width="1.1" stroke-linecap="round" opacity="0.3"/>

  <!-- Neck and metal ferrule. -->
  <path d="M10.7 57.4h6.6l-0.9 4.4h-4.8Z" fill="url(#probeRedBody)" stroke="#460c14" stroke-width="0.7"/>
  <rect x="10.6" y="61.2" width="6.8" height="3.6" rx="1.1" fill="#9aa5b2" stroke="#39424c" stroke-width="0.7"/>

  <!-- Tapered steel needle. -->
  <path d="M11.7 64.4h4.6L14 84.4Z" fill="url(#probeRedSteel)"/>
  <path d="M13.2 66.5h1.5L14 82Z" fill="#f6f9fc" opacity="0.55"/>
</svg>
