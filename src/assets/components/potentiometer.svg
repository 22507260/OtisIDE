<?xml version="1.0" encoding="UTF-8"?>
<!--
  A panel potentiometer: knurled black knob on a metal bushing, three legs.

  The viewBox is in the same units the canvas draws it at, so the numbers here
  are the numbers on the board: the legs sit at x = 7.5, 19 and 30.5, exactly
  one breadboard hole pitch (11.5) apart, which is what lets all three reach
  three separate holes. The old artwork had them 0.82 of a pitch apart, so two
  legs kept claiming the same hole and one of them was dropped.

  No pointer is drawn on the knob: the canvas paints that on top, turned to
  whatever the wiper is set to.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="38" height="46" viewBox="0 0 38 46">
  <defs>
    <radialGradient id="pot-knob" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#5a5f66"/>
      <stop offset="0.55" stop-color="#2c3036"/>
      <stop offset="1" stop-color="#111417"/>
    </radialGradient>
    <linearGradient id="pot-bushing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f757c"/>
      <stop offset="0.45" stop-color="#c3c9cf"/>
      <stop offset="1" stop-color="#767c83"/>
    </linearGradient>
    <linearGradient id="pot-leg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d7278"/>
      <stop offset="0.4" stop-color="#c8ccd0"/>
      <stop offset="1" stop-color="#7b8087"/>
    </linearGradient>
  </defs>

  <g id="breadboard">
    <!-- Bushing and base, behind the knob -->
    <rect x="11.5" y="24" width="15" height="9" rx="1.6" fill="url(#pot-bushing)"/>
    <rect x="8.5" y="30" width="21" height="7" rx="2" fill="#3d4249"/>
    <rect x="8.5" y="30" width="21" height="2.2" rx="1.1" fill="#4d535b"/>

    <!-- Knurled rim: ridges around the knob, drawn before the top face -->
    <circle cx="19" cy="17" r="14" fill="#0d1013"/>
    <g fill="#3a4046">
      <rect x="18.2" y="3.4" width="1.6" height="3.4" rx="0.7"/>
      <rect x="18.2" y="27.2" width="1.6" height="3.4" rx="0.7"/>
      <rect x="5.4" y="16.2" width="3.4" height="1.6" rx="0.7"/>
      <rect x="29.2" y="16.2" width="3.4" height="1.6" rx="0.7"/>
      <rect x="8.6" y="7" width="1.6" height="3.4" rx="0.7" transform="rotate(-45 9.4 8.7)"/>
      <rect x="27.8" y="7" width="1.6" height="3.4" rx="0.7" transform="rotate(45 28.6 8.7)"/>
      <rect x="8.6" y="23.6" width="1.6" height="3.4" rx="0.7" transform="rotate(45 9.4 25.3)"/>
      <rect x="27.8" y="23.6" width="1.6" height="3.4" rx="0.7" transform="rotate(-45 28.6 25.3)"/>
    </g>

    <!-- Knob body -->
    <circle cx="19" cy="17" r="12.4" fill="url(#pot-knob)"/>
    <circle cx="19" cy="17" r="12.4" fill="none" stroke="#05070a" stroke-width="0.8"/>
    <!-- Top face, a shade lighter so the rim reads as a rim -->
    <circle cx="19" cy="17" r="8.6" fill="#23272d"/>
    <circle cx="19" cy="17" r="8.6" fill="none" stroke="#454b53" stroke-width="0.6"/>
    <!-- Specular, off-centre so the knob looks turned rather than printed -->
    <ellipse cx="15" cy="12.4" rx="4.6" ry="3" fill="#ffffff" opacity="0.13"/>
    <circle cx="19" cy="17" r="1.5" fill="#14181c"/>

    <!-- Legs. Centres at x = 7.5 / 19 / 30.5, one hole pitch apart. -->
    <rect id="connector0pin" x="6.3" y="35" width="2.4" height="9" fill="url(#pot-leg)"/>
    <rect id="connector0terminal" x="6.3" y="42" width="2.4" height="2" fill="none"/>
    <rect id="connector1pin" x="17.8" y="35" width="2.4" height="9" fill="url(#pot-leg)"/>
    <rect id="connector1terminal" x="17.8" y="42" width="2.4" height="2" fill="none"/>
    <rect id="connector2pin" x="29.3" y="35" width="2.4" height="9" fill="url(#pot-leg)"/>
    <rect id="connector2terminal" x="29.3" y="42" width="2.4" height="2" fill="none"/>
  </g>
</svg>
