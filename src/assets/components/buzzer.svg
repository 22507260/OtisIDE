<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
	 x="0px" y="0px" width="56.693px" height="56.693px" viewBox="0 0 56.693 56.693" xml:space="preserve">
<defs>
	<linearGradient id="buzzerCase" x1="8" y1="0" x2="49" y2="0" gradientUnits="userSpaceOnUse">
		<stop offset="0" stop-color="#0d1014"/>
		<stop offset="0.3" stop-color="#3a4149"/>
		<stop offset="0.55" stop-color="#242a31"/>
		<stop offset="1" stop-color="#080a0d"/>
	</linearGradient>
	<radialGradient id="buzzerTop" cx="23" cy="17" r="26" gradientUnits="userSpaceOnUse">
		<stop offset="0" stop-color="#39424c"/>
		<stop offset="0.7" stop-color="#1b2026"/>
		<stop offset="1" stop-color="#101418"/>
	</radialGradient>
</defs>
<g id="breadboard">
	<!-- Legs, one hole pitch apart so it plugs straight into the board. -->
	<rect x="18.9" y="43" width="1.7" height="10" fill="#9aa3ad"/>
	<rect x="36.1" y="43" width="1.7" height="10" fill="#9aa3ad"/>

	<!-- The moulded case: a squat cylinder seen a little from above. -->
	<ellipse cx="28.35" cy="44.5" rx="19.5" ry="5" fill="#05070a" opacity="0.55"/>
	<path d="M8.85 26.5h39v14.5c0 3.1-8.7 5.6-19.5 5.6s-19.5-2.5-19.5-5.6V26.5Z" fill="url(#buzzerCase)"/>
	<ellipse cx="28.35" cy="26.5" rx="19.5" ry="6.2" fill="url(#buzzerTop)"/>
	<ellipse cx="28.35" cy="26.5" rx="19.5" ry="6.2" fill="none" stroke="#050709" stroke-width="0.9"/>

	<!-- Sound hole. -->
	<ellipse cx="28.35" cy="26.2" rx="3.5" ry="1.5" fill="#04060a"/>
	<ellipse cx="28.35" cy="25.9" rx="2.2" ry="0.9" fill="#565f69" opacity="0.5"/>

	<!-- The light along the top edge is what makes it read as round. -->
	<path d="M13.5 23.6c3.2-2 8.6-3.3 14.85-3.3" stroke="#8b96a3" stroke-width="1.5"
		stroke-linecap="round" fill="none" opacity="0.45"/>
	<path d="M10.4 34.5c0 2 3 3.4 3 3.4" stroke="#7c8794" stroke-width="1.2"
		stroke-linecap="round" fill="none" opacity="0.3"/>

	<!-- The polarity mark, beside the leg it belongs to. -->
	<rect x="16.4" y="35.2" width="5.2" height="1.3" rx="0.6" fill="#e8edf3" opacity="0.85"/>
	<rect x="18.35" y="33.25" width="1.3" height="5.2" rx="0.6" fill="#e8edf3" opacity="0.85"/>

	<!-- Connector pads. Their positions are the pins: the plus on the marked
	     leg, the minus on the other. -->
	<circle id="connector2pin" fill="none" stroke="#9A916C" stroke-width="1.44" cx="36.95" cy="50" r="2.404"/>
	<circle id="connector3pin" fill="none" stroke="#9A916C" stroke-width="1.44" cx="19.75" cy="50" r="2.404"/>
</g>
</svg>
