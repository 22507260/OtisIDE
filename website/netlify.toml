# Manual deploy — this folder is the site root, there is no build step.
#   Drag & drop : https://app.netlify.com/drop  (drop the whole "website" folder)
#   CLI         : netlify deploy --dir=website --prod
#
# Netlify reads this file from the root of the deployed folder.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Serve the installer as a download instead of letting the browser guess.
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
