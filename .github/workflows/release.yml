name: Release

# Pushing a v* tag builds the Windows installer on GitHub's runners and attaches
# it to the release, together with the latest.yml and .blockmap files the
# in-app updater reads. Publishing from a developer machine used to fail
# halfway through the 111 MB upload and left releases without their installer.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Refuse to publish a tag that does not match package.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Build and publish the installer
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm the release carries all three assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$assets"
          for file in "OtisIDE-$version-x64.exe" "latest.yml" "OtisIDE-$version-x64.exe.blockmap"; do
            echo "$assets" | grep -qx "$file" || { echo "Missing asset: $file"; exit 1; }
          done

  # Runs after the Windows job so both are not racing to create the release.
  linux:
    needs: windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Building the Arch package means writing its .MTREE, which fpm shells
      # out to bsdtar for. The runner image does not ship it.
      - name: Install bsdtar for the Arch package
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Build and publish the Linux packages
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Turns the release into a pacman repository, so Arch users add it once
      # and then install and upgrade OtisIDE with the rest of their system.
      # repo-add ships with pacman, which the runner does not have, so it runs
      # in an Arch container against the package just built.
      - name: Build the pacman repository database
        run: |
          docker run --rm -v "$PWD/release:/repo" -w /repo archlinux:base \
            bash -c "repo-add --quiet otiside.db.tar.gz OtisIDE.pacman"
          # repo-add leaves otiside.db as a symlink to the tarball, and a
          # release asset cannot be a symlink, so the names pacman asks for are
          # written out as real files in its place.
          rm -f release/otiside.db release/otiside.files
          cp release/otiside.db.tar.gz release/otiside.db
          cp release/otiside.files.tar.gz release/otiside.files
          tar -xzOf release/otiside.db --wildcards '*/desc'

      - name: Publish the repository database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            release/otiside.db release/otiside.files \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Confirm every Linux package is there
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$assets"
          echo "$assets" | grep -qx "OtisIDE-$version-x86_64.AppImage" || { echo "Missing the AppImage"; exit 1; }
          echo "$assets" | grep -q "\.deb$" || { echo "Missing the deb"; exit 1; }
          echo "$assets" | grep -qx "OtisIDE.pacman" || { echo "Missing the Arch package"; exit 1; }
          echo "$assets" | grep -qx "otiside.db" || { echo "Missing the repository database"; exit 1; }
          # The database has to name the package file exactly as it is published,
          # or pacman asks the release for a file that is not there.
          tar -xzOf release/otiside.db --wildcards '*/desc' | grep -A1 '%FILENAME%' | grep -qx "OtisIDE.pacman" \
            || { echo "The database points at a different file name"; exit 1; }
